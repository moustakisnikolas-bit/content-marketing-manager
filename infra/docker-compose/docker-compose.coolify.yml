name: content-studio

# Coolify-specific: functionally identical to docker-compose.yml +
# docker-compose.prod.yml combined, but fully self-contained — Coolify's
# docker-compose deployment does not resolve the `include:` directive
# those two files use (confirmed live: it fails with "depends on undefined
# service" for anything only defined in the included file), so this single
# file inlines every service instead. docker-compose.yml/docker-compose.prod.yml
# remain the source of truth for local dev/testing (include: works fine
# there via the plain `docker compose` CLI) — keep both in sync by hand if
# either changes; this is duplication accepted deliberately rather than
# fighting Coolify's compose parser.
#
# Internal-only services (postgres, redis, temporal, opa, openbao,
# seaweedfs, otel-collector, prometheus, grafana) do NOT publish host
# ports here, unlike the local dev-testing file — nothing outside the
# Docker network needs to reach them directly on a real server, and this
# avoids port conflicts with any other project sharing this VPS later.
#
# All relative paths (build contexts) are relative to the REPO ROOT, not
# to this file's own directory — Coolify runs
# `docker compose --project-directory <repo-root> -f <this file>`, and
# Compose resolves relative paths against --project-directory when it's
# explicitly passed, not against the compose file's location (confirmed
# live: `context: ../../backend` resolved to `/backend`, i.e. two levels
# above repo root, not `<repo-root>/backend`). This differs from local
# dev, where plain `docker compose` run from infra/docker-compose/
# resolves relative paths against that directory instead.
#
# Small static config files (postgres init script, OPA policies, otel/
# prometheus/grafana config) are baked into tiny built images via
# dockerfile_inline instead of host bind-mounted — confirmed live that
# Coolify's runtime deploy directory (/data/coolify/applications/<uuid>/,
# separate from the ephemeral /artifacts/<deployment-uuid>/ used for
# builds) does not reliably contain the git-checked-out files a bind
# mount needs; Docker's fallback behavior (auto-create the missing host
# path as an empty directory) then breaks the mount since the container
# expects a file. Build contexts, by contrast, use the correctly-cloned
# /artifacts directory and have proven to work.

x-postgres-env: &postgres-env
  POSTGRES_USER: content_studio
  POSTGRES_PASSWORD: content_studio_dev
  POSTGRES_DB: content_studio

x-backend-env: &backend-env
  CS_DATABASE_URL: postgresql+asyncpg://content_studio:content_studio_dev@postgres:5432/content_studio
  CS_REDIS_URL: redis://redis:6379/0
  CS_OBJECT_STORAGE_ENDPOINT: http://seaweedfs:8333
  CS_OBJECT_STORAGE_BUCKET: content-studio-assets
  CS_OBJECT_STORAGE_ACCESS_KEY: dev
  CS_OBJECT_STORAGE_SECRET_KEY: dev-secret
  CS_TEMPORAL_TARGET: temporal:7233
  CS_TEMPORAL_NAMESPACE: default
  CS_TEMPORAL_TASK_QUEUE: content-studio
  CS_OPA_URL: http://opa:8181
  CS_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
  CS_ENVIRONMENT: ${CS_ENVIRONMENT:-production}
  CS_JWT_SECRET: ${CS_JWT_SECRET:-dev-only-change-me}
  CS_OPENBAO_URL: http://openbao:8200
  CS_OPENBAO_TOKEN: ${CS_OPENBAO_TOKEN:-dev-root-token}
  CS_AI_TEXT_API_KEY: ${CS_AI_TEXT_API_KEY:-}
  CS_REPLICATE_API_TOKEN: ${CS_REPLICATE_API_TOKEN:-}
  CS_PUBLIC_API_BASE_URL: ${CS_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
  CS_CORS_ALLOWED_ORIGINS: ${CS_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  CS_SOCIAL_OAUTH_REDIRECT_BASE_URL: ${CS_SOCIAL_OAUTH_REDIRECT_BASE_URL:-http://localhost:3000/oauth/callback}

services:
  postgres:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:16-alpine
        COPY infra/docker-compose/postgres/init-multi-db.sh /docker-entrypoint-initdb.d/init-multi-db.sh
        RUN chmod +x /docker-entrypoint-initdb.d/init-multi-db.sh
    environment:
      <<: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  temporal:
    image: temporalio/auto-setup:1.28
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: content_studio
      POSTGRES_PWD: content_studio_dev
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  opa:
    build:
      context: .
      dockerfile_inline: |
        FROM openpolicyagent/opa:latest-envoy
        COPY infra/opa-policies /policies
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]

  # Real (non-dev) OpenBao: file storage on a persistent volume so sealed
  # credentials survive container recreation (confirmed live: dev mode's
  # in-memory storage was wiped on every Coolify redeploy, breaking every
  # previously-connected store/social account each time — see
  # windows-dev-gotchas). Production mode starts sealed after every restart
  # and needs 2-of-3 unseal keys before it'll serve secrets again; bootstrap.sh
  # automates that (init once, unseal every boot) using keys persisted on
  # the same volume as the encrypted data itself — deliberately the same
  # trust model as dev mode's env-var-visible root token (whoever can reach
  # the VPS/volume already has the keys either way), accepted for this
  # personal-use/pre-commercial stage. Revisit (e.g. real KMS auto-unseal,
  # keys kept off-box) before real customer secrets are at stake.
  openbao:
    build:
      context: .
      dockerfile_inline: |
        FROM openbao/openbao:latest
        USER root
        RUN apk add --no-cache jq
        COPY infra/docker-compose/openbao/config.hcl /openbao/config.hcl
        COPY infra/docker-compose/openbao/bootstrap.sh /openbao/bootstrap.sh
        RUN chmod +x /openbao/bootstrap.sh && mkdir -p /openbao/data
        ENTRYPOINT []
        CMD ["/openbao/bootstrap.sh"]
    cap_add:
      - IPC_LOCK
    environment:
      CS_OPENBAO_TOKEN: ${CS_OPENBAO_TOKEN:-dev-root-token}
    volumes:
      - openbao_data:/openbao/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-s3.port=8333", "-dir=/data", "-master.volumeSizeLimitMB=1024"]
    # A published port (not just `expose:`) is what Coolify's Traefik
    # auto-port-detection actually keys off, same as backend/frontend below —
    # confirmed needed after docker_compose_domains routing 502'd with no
    # loadbalancer.server.port label until this was added.
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data

  otel-collector:
    build:
      context: .
      dockerfile_inline: |
        FROM otel/opentelemetry-collector-contrib:latest
        COPY infra/docker-compose/otel/otel-collector-config.yaml /etc/otel-collector-config.yaml
    command: ["--config=/etc/otel-collector-config.yaml"]

  prometheus:
    build:
      context: .
      dockerfile_inline: |
        FROM prom/prometheus:latest
        COPY infra/docker-compose/prometheus/prometheus.yml /etc/prometheus/prometheus.yml

  grafana:
    build:
      context: .
      dockerfile_inline: |
        FROM grafana/grafana:latest
        COPY infra/docker-compose/grafana/provisioning /etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_PASSWORD: dev
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  backend:
    build:
      context: ./backend
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    # Host port 8000 is taken by Coolify's own dashboard/API on this VPS —
    # 8001 avoids the collision (confirmed live: plain 8000:8000 failed
    # with "port is already allocated").
    ports:
      - "8001:8000"
    restart: on-failure

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "content_studio.workflows.worker"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      backend:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  seaweedfs_data:
  grafana_data:
  openbao_data:
